# Netlify build settings. Security headers aren't here: Hugo generates
# public/_headers (layouts/home.headers) so the content security policy can
# carry the inline boot script's hash.
#
# Free plan budget (docs/ARCHITECTURE.md): each production deploy costs 15
# credits from 300 a month, shared by every project on the account. Batch
# changes before merging to main.

[build]
  publish = "public"
  command = "hugo --gc --minify -b $URL && cp public/hits-allowlist.json netlify/functions/hit/allowlist.json"
  # Skip the build when nothing that ships has changed since the last one:
  # docs, tests and the agent notes only. Exit 0 skips; anything else builds,
  # so a missing or equal cached commit (a first or clear-cache build) builds.
  ignore = '''[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude)docs' ':(exclude)tests' ':(exclude)README.md' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' '''

[build.environment]
  HUGO_VERSION = "0.167.0"
  NODE_VERSION = "22"
  # Only the function's runtime dependency is needed on Netlify; the test
  # tools are for CI.
  NPM_FLAGS = "--omit=dev"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL && cp public/hits-allowlist.json netlify/functions/hit/allowlist.json"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL && cp public/hits-allowlist.json netlify/functions/hit/allowlist.json"

[functions]
  node_bundler = "esbuild"
